name: CI

# push·PR마다 결정적 심사 로직/파서/랭킹 단위 테스트를 자동 실행한다.
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loan_suitability_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U test_user -d loan_suitability_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        # job이 러너에 직접 뜨므로 포트를 매핑해야 localhost로 닿는다. 매핑을 빠뜨리면
        # 접속이 실패하고, 그 실패가 곧바로 테스트 건너뛰기로 바뀌어 초록 배지 뒤에서
        # DB 검증이 0건이 된다.
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 테스트가 API와 Streamlit 클라이언트를 실제로 import하므로 런타임 의존성 전체를 설치한다.
      # 운영 이미지와 같은 잠금 파일로 설치해야 테스트한 버전이 배포되는 버전과 같다. 범위만 적힌
      # requirements.txt로 설치하면 실행할 때마다 다른 버전이 풀린다.
      # PostgreSQL 통합 테스트는 러너 서비스에 연결한다.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements.lock
          pip install pytest

      - name: Run pytest
        env:
          OPENAI_API_KEY: ""
          DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/loan_suitability_test
        run: pytest

      # 배포되는 잠금 파일 자체를 감사한다. 대상 파일 없이 돌리면 pip-audit는 자기가 설치된 환경을
      # 감사하므로 반드시 -r로 넘긴다. 예외 목록은 게이트와 같은 규칙으로 읽어 사유가 있는 줄만 적용한다 —
      # 앞 공백은 지우고 `ID  # 사유` 형태만 받는다. 이 스텝은 `bash -eo pipefail`로 돌아서 grep처럼
      # 일치가 없을 때 실패하는 명령을 쓰면 목록이 비었거나 파일이 없을 때 감사 전에 스텝이 멈춘다.
      # awk는 일치가 없어도 0으로 끝나고, 파일이 없으면 예외 없이 감사한다.
      # pip-audit는 별도 가상환경에 설치한다. 테스트가 쓴 환경에 설치하면 pip-audit의 의존성 요구가
      # 잠금 버전과 부딪혀, 성공한 스텝 로그에 pip의 `ERROR:` 줄이 찍히고 잠금으로 설치한 패키지가 바뀐다.
      - name: Audit locked dependencies
        run: |
          python -m venv /tmp/pip-audit-venv
          /tmp/pip-audit-venv/bin/pip install --quiet pip-audit
          ignores=""
          if [ -f .pip-audit-ignore ]; then
            ignores=$(awk '{ sub(/^[ \t]+/, "") } /^[A-Za-z0-9][A-Za-z0-9._:-]+[ \t]+#[ \t]*[^ \t]/ { printf "--ignore-vuln %s ", $1 }' .pip-audit-ignore)
          fi
          /tmp/pip-audit-venv/bin/pip-audit -r requirements.lock --require-hashes --no-deps --disable-pip --progress-spinner off $ignores
