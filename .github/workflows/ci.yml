name: CI

# push·PR마다 결정적 심사 로직/파서/랭킹 단위 테스트를 자동 실행한다.
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loan_suitability_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U test_user -d loan_suitability_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        # job이 러너에 직접 뜨므로 포트를 매핑해야 localhost로 닿는다. 매핑을 빠뜨리면
        # 접속이 실패하고, 그 실패가 곧바로 테스트 건너뛰기로 바뀌어 초록 배지 뒤에서
        # DB 검증이 0건이 된다.
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 테스트는 LLM 호출을 하지 않아 무거운 런타임 의존성을 설치하지 않는다. PostgreSQL 통합
      # 테스트는 러너 서비스에 연결하므로, 애플리케이션과 같은 드라이버를 명시적으로 설치한다.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dotenv fastapi httpx sqlalchemy psycopg2-binary alembic

      - name: Run pytest
        env:
          OPENAI_API_KEY: ""
          DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/loan_suitability_test
        run: pytest
