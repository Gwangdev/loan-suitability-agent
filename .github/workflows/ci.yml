name: CI

# push·PR마다 결정적 심사 로직/파서/랭킹 단위 테스트를 자동 실행한다.
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 단위·API 테스트는 crewai/streamlit 등 무거운 LLM 의존성 없이
      #   동작하도록 설계돼 있어(core가 crewai 없이 import 가능, /advise의 LLM 경로는 테스트에서
      #   호출하지 않음), 경량 의존성만 설치한다. → CI가 빠르고 외부 API 키도 필요 없다.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-dotenv fastapi httpx

      - name: Run pytest
        env:
          OPENAI_API_KEY: ""   # 테스트는 키 불필요 — 명시적으로 빈 값
        run: pytest
