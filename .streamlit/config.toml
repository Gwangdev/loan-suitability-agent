# Streamlit은 기본값(base 미지정)에서 브라우저·OS의 다크 모드 선호를 따라간다.
# 그러면 static/apple.css가 라이트 배경을 전제로 지정한 색이 다크 팔레트 위에 얹혀
# 검정 배경에 검정 글자가 나온다(운영 첫 사용에서 발견). 심사자가 휴대폰 다크 모드로 링크를 열면
# 그 화면이 제출물의 전부이므로, 대비를 브라우저 설정에 맡기지 않는다.
#
# 근본 해결은 CSS가 두 팔레트를 모두 지원하는 것이고 그것은 4단계 작업이다. 여기서
# 고정하는 것은 그 작업이 밀려도 남아 있어야 하는 바닥이다.
[theme]
base = "light"

[browser]
gatherUsageStats = false

# 기본값 full이면 화면 코드에서 잡지 않은 예외가 서버 파일 경로·코드 줄이 담긴 traceback째
# 화면에 뜨고, 같은 내용이 방문자의 개발자도구에서도 보였다. none으로 두면 브라우저에는 일반
# 오류 문구만 보이고, 예외 타입·메시지·traceback은 서버 콘솔(컨테이너 로그)에만 남는다.
[client]
showErrorDetails = "none"
