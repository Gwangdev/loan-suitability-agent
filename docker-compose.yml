name: loan-suitability-agent

x-logging: &service-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  ui:
    build:
      context: .
    command:
      - streamlit
      - run
      - loan_agent/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    # env_file을 두지 않는다. `.env` 전체를 넘기면 화면이 쓰지도 않는 DB 비밀번호와
    # 서버 OpenAI 키가 이 컨테이너 환경에 들어간다. 화면은 API를 부를 뿐 DB에 접속하지
    # 않고, 방문자 키는 세션 메모리에서만 흐른다(ADR-024 §24-R). 필요한 값만 적는다.
    environment:
      API_BASE_URL: http://app:8000
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/_stcore/health || exit 1"]
    logging: *service-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # 스키마 적용은 앱 기동과 분리한다. 앱 프로세스에 섞으면 인스턴스가 둘 이상일 때
  # 같은 마이그레이션을 동시에 돌려 경쟁하고, "기동 시 자동 생성하지 않는다"는 규칙과도
  # 경계가 흐려진다. 한 번 실행하고 끝나는 서비스로 두고 앱이 그 완료를 기다린다.
  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    # 이미지의 기본 사용자(appuser)에 기대지 않고 app과 같이 compose에 적는다. 한 번 실행하고
    # 끝나는 서비스라 빠져 있었는데, 스키마를 바꾸는 권한을 가진 컨테이너가 루트 파일시스템에
    # 쓸 수 있을 이유는 없다. 쓰기는 DB로만 나간다.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-loan_suitability}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    # 이미지의 HEALTHCHECK는 화면(:8501)을 보는데, migrate는 1초 남짓에 끝나 검사가 한 번도 돌지 않고
    # 멈춘 컨테이너에 `unhealthy`만 남아 운영 상태를 읽는 쪽에 거짓 신호가 됐다. app은 이 서비스를
    # 상태 확인이 아니라 종료 코드(service_completed_successfully)로 기다리므로 꺼도 판정은 그대로다.
    healthcheck:
      disable: true
    logging: *service-logging

  app:
    build:
      context: .
    command:
      - uvicorn
      - loan_agent.api:app
      - --host=0.0.0.0
      - --port=8000
      # 요청 로그는 앱이 식별자와 함께 JSON으로 남긴다(`loan_agent/api/request_log.py`).
      # uvicorn 접근 로그를 켜 두면 같은 요청이 식별자 없는 평문으로 한 번 더 찍힌다.
      - --no-access-log
      # 서버 자체 로그도 같은 한 줄 JSON으로 쓴다. 기본 설정은 평문이고 traceback이 여러 줄이라,
      # 수집기가 줄 단위로 읽으면 한 기록이 여러 조각으로 흩어져 앱 로그와 시간순으로 합칠 수 없다.
      - --log-config=loan_agent/uvicorn_log.json
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-loan_suitability}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ready || exit 1"]
    logging: *service-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  worker:
    # 운영에는 배포하지 않는다(ADR-031 §31.3). 서버 키가 없어 할 일이 없고, 켜 두면
    # 방문자가 집으려던 PENDING 행을 먼저 집어 실패시킨다. 로컬에서만 켠다:
    #   docker compose --profile local up -d
    profiles: ["local"]
    build:
      context: .
    command:
      - python
      - -m
      - loan_agent.worker
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-loan_suitability}
    env_file:
      - path: .env
        required: false
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    # 호스트에 포트를 열지 않는다. 들어오는 요청을 받지 않고 DB만 폴링하므로
    # 열어 둘 이유가 없고, 열면 공격 표면만 늘어난다.
    # 네트워크는 둘이다. backend는 DB에 닿는 길이고 내부 전용이라 이름 해석조차 되지 않아,
    # 여기에만 두면 서버 키로 부르는 모델 호출이 연결 단계에서 실패해 제공자 오류로 기록된다.
    # 외부로 나가는 길은 egress로 따로 준다. 들어오는 경로인 frontend에 붙이면 화면까지 닿게 된다.
    networks:
      - backend
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
    logging: *service-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loan_suitability}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    # alpine 변형의 postgres는 uid/gid 70이다. 데비안 이미지의 999를 그대로 쓰면
    # 컨테이너가 볼륨을 소유하지 못해 initdb가 chmod에서 멈춘다 — 클린 체크아웃에서
    # 스택이 아예 뜨지 않는다. 이미지 변형과 uid는 함께 정해야 한다.
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp:uid=70,gid=70,mode=1777
      - /var/run/postgresql:uid=70,gid=70,mode=1777
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *service-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

networks:
  frontend:
  backend:
    internal: true
  # 워커 전용 외부 통신 네트워크. 다른 서비스를 붙이면 그 서비스에도 이유 없는 외부 경로가 생긴다.
  egress:

volumes:
  postgres_data:
