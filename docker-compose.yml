name: loan-suitability-agent

x-logging: &service-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  ui:
    build:
      context: .
    command:
      - streamlit
      - run
      - loan_agent/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    env_file:
      - path: .env
        required: false
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    ports:
      - "8501:8501"
    networks:
      - frontend
    logging: *service-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  app:
    build:
      context: .
    command:
      - uvicorn
      - loan_agent.api:app
      - --host=0.0.0.0
      - --port=8000
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-loan_suitability}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    ports:
      - "8000:8000"
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    logging: *service-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loan_suitability}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:uid=999,gid=999,mode=1777
      - /var/run/postgresql:uid=999,gid=999,mode=1777
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *service-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
